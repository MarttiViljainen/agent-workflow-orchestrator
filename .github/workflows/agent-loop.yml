name: Agent Change Loop (reusable)

on:
  workflow_call:
    inputs:
      spec_path:
        required: true
        type: string
      test_command:
        required: true
        type: string
      test_dir:
        required: false
        type: string
        default: "tests"
      diff_base:
        required: true
        type: string
      max_fix_attempts:
        description: "How many repair attempts after a failing test run."
        required: false
        type: number
        default: 2
      max_fix_tokens:
        description: "Total token budget across ALL fix attempts combined, not per attempt."
        required: false
        type: number
        default: 20000
    secrets:
      ANTHROPIC_API_KEY:
        required: true
        
permissions:
  contents: write
  pull-requests: write

jobs:
  agent-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # check out the PR head branch itself, not the detached merge commit —
          # spec_updater/test_updater push their commits back to this branch
          ref: ${{ github.head_ref || github.ref }}

      - name: Checkout orchestrator scripts
        uses: actions/checkout@v4
        with:
          repository: MarttiViljainen/agent-workflow-orchestrator
          path: .agent-orchestrator

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install anthropic pyyaml

      - name: Generate diff
        run: git diff ${{ inputs.diff_base }} -- . > diff.patch

      - name: Impact analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .agent-orchestrator/scripts/impact_analysis.py --diff diff.patch --spec ${{ inputs.spec_path }} --out impact_report.yaml

      - name: Spec update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .agent-orchestrator/scripts/spec_updater.py --diff diff.patch --spec ${{ inputs.spec_path }} --impact impact_report.yaml --out spec_patch.diff

      - name: Test update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .agent-orchestrator/scripts/test_updater.py --diff diff.patch --impact impact_report.yaml --test-dir ${{ inputs.test_dir }} --out test_patch.diff

      - name: Run tests
        id: run_tests
        continue-on-error: true
        run: |
          set -o pipefail
          ( ${{ inputs.test_command }} ) 2>&1 | tee pytest.log

      # Actions has no native retry loop, so the bounded loop lives in bash.
      # fix_failure.py owns all the state; the loop only branches on its exit
      # code: 0 = fix written, non-zero = stop (2 budget, 3 no fix offered).
      - name: Fix retry loop
        id: fix_loop
        if: steps.run_tests.outcome != 'success'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          FIX="python .agent-orchestrator/scripts/fix_failure.py --state fix_attempt_state.json"
          RESULT=fail
          attempt=0
          while [ "$attempt" -lt "${{ inputs.max_fix_attempts }}" ]; do
            attempt=$((attempt + 1))
            echo "::group::fix attempt $attempt"
            set +e
            $FIX --failure-log pytest.log --diff diff.patch \
                 --attempt "$attempt" \
                 --max-attempts ${{ inputs.max_fix_attempts }} \
                 --max-tokens ${{ inputs.max_fix_tokens }} \
                 --base-dir . --branch "${{ github.head_ref }}"
            rc=$?
            set -e
            if [ $rc -ne 0 ]; then
              echo "fix loop stopping (fix_failure.py exit $rc)"
              echo "::endgroup::"
              break
            fi
            set +e
            ( ${{ inputs.test_command }} ) > pytest.log 2>&1
            test_rc=$?
            set -e
            tail -40 pytest.log
            echo "::endgroup::"
            if [ $test_rc -eq 0 ]; then
              $FIX --record-test-result pass --branch "${{ github.head_ref }}"
              RESULT=pass
              break
            fi
            $FIX --record-test-result fail
          done
          $FIX --finalize
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Aggregate PR comment
        if: always()
        run: |
          python .agent-orchestrator/scripts/aggregate_comment.py \
            --impact impact_report.yaml --spec-diff spec_patch.diff \
            --test-diff test_patch.diff \
            --fix-log fix_attempt_state.json \
            --ci-result ${{ (steps.run_tests.outcome == 'success' || steps.fix_loop.outputs.result == 'pass') && 'pass' || 'fail' }} \
            --out comment.md

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail job if CI failed
        if: steps.run_tests.outcome != 'success' && steps.fix_loop.outputs.result != 'pass'
        run: exit 1
